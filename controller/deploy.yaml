apiVersion: v1
kind: Namespace
metadata:
  name: pod-migration-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-migration-controller
  namespace: pod-migration-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-migration-controller-role
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/eviction
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - pods/status
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - criu.podmigration.gke.io
      - podsnapshot.gke.io
    resources:
      - podsnapshotmanualtriggers
      - podsnapshotpolicies
      - podsnapshotstorageconfigs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - criu.podmigration.gke.io
      - podsnapshot.gke.io
    resources:
      - podsnapshots
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - criu.podmigration.gke.io
      - podsnapshot.gke.io
    resources:
      - podsnapshots/status
    verbs:
      - get
  - apiGroups:
      - podmigration.gke.io
    resources:
      - podmigrationjobs
      - podmigrations
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - podmigration.gke.io
    resources:
      - podmigrationjobs/finalizers
      - podmigrations/finalizers
    verbs:
      - update
  - apiGroups:
      - podmigration.gke.io
    resources:
      - podmigrationjobs/status
      - podmigrations/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - volumeattachments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pm-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-migration-controller-role
subjects:
  - kind: ServiceAccount
    name: pod-migration-controller
    namespace: pod-migration-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-migration-leader-election-role
  namespace: pod-migration-system
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-migration-leader-election-rolebinding
  namespace: pod-migration-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-migration-leader-election-role
subjects:
  - kind: ServiceAccount
    name: pod-migration-controller
    namespace: pod-migration-system
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: pod-migration-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-cert
  namespace: pod-migration-system
spec:
  dnsNames:
    - webhook-service.pod-migration-system.svc
    - webhook-service.pod-migration-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-migration-controller
  namespace: pod-migration-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pod-migration-controller
  template:
    metadata:
      labels:
        app: pod-migration-controller
    spec:
      topologySpreadConstraints:
        # Use ScheduleAnyway to allow both replicas to schedule on small or single-node development
        # clusters while still spreading across distinct nodes whenever multi-node topology is available.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pod-migration-controller
      serviceAccountName: pod-migration-controller
      containers:
        - name: manager
          image: <YOUR_CONTROLLER_IMAGE>
          imagePullPolicy: Always
          command:
            - /manager
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect=true
            - --client-go-qps=500
            - --client-go-burst=1000
            - --max-concurrent-reconciles=50
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: webhook-server-cert
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: pod-migration-system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app: pod-migration-controller
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: pod-migration-system/webhook-cert
webhooks:
  - name: veviction.podmigration.gke.io
    admissionReviewVersions: ["v1"]
    sideEffects: NoneOnDryRun
    failurePolicy: Ignore
    timeoutSeconds: 10
    clientConfig:
      service:
        namespace: pod-migration-system
        name: webhook-service
        path: /validate-v1-pod-eviction
        port: 443
    namespaceSelector:
      matchLabels:
        pod-migration.gke.io/managed: "true"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - pod-migration-system
            - kube-system
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/eviction"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: pod-migration-system/webhook-cert
webhooks:
  - name: mpodgate.podmigration.gke.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: pod-migration-system
        name: webhook-service
        path: /mutate-v1-pod-scheduling-gate
        port: 443
    namespaceSelector:
      matchLabels:
        pod-migration.gke.io/managed: "true"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - pod-migration-system
            - kube-system
    matchConditions:
      - name: gvisor-runtime-class
        expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor'"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced

  - name: mpodgate-runc.podmigration.gke.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: pod-migration-system
        name: webhook-service
        path: /mutate-v1-pod-scheduling-gate
        port: 443
    namespaceSelector:
      matchLabels:
        pod-migration.gke.io/managed: "true"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - pod-migration-system
            - kube-system
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced

  - name: mpodstatus.podmigration.gke.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: pod-migration-system
        name: webhook-service
        path: /mutate-v1-pod-status
        port: 443
    objectSelector:
      matchLabels:
        pod-migration.gke.io/enabled: "true"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - pod-migration-system
            - kube-system
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/status"]
        scope: Namespaced

  # Holds Ready=False on a fenced migration source (#131). failurePolicy Fail:
  # with Ignore, the kubelet's next status write would end the fence silently.
  - name: mpodfence.podmigration.gke.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Fail: if this webhook let a status write through, the kubelet's next
    # write would set a fenced source Ready again (#131). The cost: while the
    # controller is down, a fenced pod can't finish deleting, because the
    # kubelet writes a pod's final status before the pod is removed, so an
    # evicted source stays Terminating and a drain waits on it. It heals when
    # the webhook is back, and only pods with the label below are affected.
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: pod-migration-system
        name: webhook-service
        path: /mutate-v1-pod-fence
        port: 443
    objectSelector:
      matchLabels:
        pod-migration.gke.io/fenced: "true"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - pod-migration-system
            - kube-system
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/status"]
        scope: Namespaced
---
# Restore orders on existing pods (C10 R1, C5, #233). mpodgate handles a
# restore order only when a pod is created. This policy covers the rest of an
# opted-in pod's life: only the controller sets, changes or removes a
# <group>/ps-name annotation on it, for any engine's group.
#
# It is an admission policy, not a webhook: the API server evaluates it
# itself, so it doesn't depend on the controller being up, and a controller
# rollout can't block pod updates. matchConditions skip every update that
# leaves the restore orders as they are, so labels (including removing
# pod-migration.gke.io/enabled to opt out), other annotations, the spec and
# the kubelet's status writes go through as before.
#
# Scope: on CREATE in managed namespaces, any pod carrying a non-empty non-GKE
# restore order annotation (<group>/ps-name != podsnapshot.gke.io/ps-name) is
# denied to prevent spoofing during fail-open webhook outages, while Kubeflow
# resume flow is preserved. On UPDATE, pods that have the opt-in label before
# or after the update: only the controller's service account may set, change
# or remove a restore order.
#
# The validation below names the controller's service account, namespace
# included. An install that renames the namespace or the service account must
# change it there too, or the controller itself is denied.
#
# To change a restore order by hand in an emergency, set the binding's
# validationActions to ["Audit"], and back to ["Deny"] afterwards (see the
# README). While it is Audit, no opted-in pod in the cluster is protected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-migration-restore-order
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        # A write to pods/status can change annotations too.
        resources: ["pods", "pods/status"]
        scope: Namespaced
    namespaceSelector:
      matchLabels:
        pod-migration.gke.io/managed: "true"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - pod-migration-system
            - kube-system
  matchConditions:
    # True on CREATE if non-controller request carries non-GKE restore annotation (<group>/ps-name != podsnapshot.gke.io/ps-name),
    # or on UPDATE when a <group>/ps-name annotation is added, changed or removed on a pod opted into migration.
    - name: restore-order-changed
      expression: >-
        (request.operation == 'CREATE' &&
        has(object.metadata.annotations) &&
        object.metadata.annotations.exists(k, k.endsWith('/ps-name') && k != 'podsnapshot.gke.io/ps-name' && object.metadata.annotations[k] != ''))
        ||
        (request.operation == 'UPDATE' &&
        ((has(object.metadata.annotations) && object.metadata.annotations.exists(k,
        k.endsWith('/ps-name') && (!has(oldObject.metadata.annotations) ||
        !(k in oldObject.metadata.annotations) ||
        oldObject.metadata.annotations[k] != object.metadata.annotations[k])))
        ||
        (has(oldObject.metadata.annotations) && oldObject.metadata.annotations.exists(k,
        k.endsWith('/ps-name') && (!has(object.metadata.annotations) ||
        !(k in object.metadata.annotations)))))
        &&
        ((has(object.metadata.labels) && 'pod-migration.gke.io/enabled' in object.metadata.labels && object.metadata.labels['pod-migration.gke.io/enabled'] == 'true') ||
        (has(oldObject.metadata.labels) && 'pod-migration.gke.io/enabled' in oldObject.metadata.labels && oldObject.metadata.labels['pod-migration.gke.io/enabled'] == 'true') ||
        (has(object.metadata.annotations) && object.metadata.annotations.exists(k, k.endsWith('/ps-name') && k != 'podsnapshot.gke.io/ps-name')) ||
        (has(oldObject.metadata.annotations) && oldObject.metadata.annotations.exists(k, k.endsWith('/ps-name') && k != 'podsnapshot.gke.io/ps-name'))))
  validations:
    # The controller's service account: the namespace and name of the
    # ServiceAccount in this file.
    - expression: >-
        request.operation == 'UPDATE' &&
        request.userInfo.username ==
        'system:serviceaccount:pod-migration-system:pod-migration-controller'
      message: >-
        only the Pod Migration controller may set, change or remove a restore
        order (<group>/ps-name) on an existing pod that is opted into migration,
        and non-GKE restore annotations may not be set on pod creation
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-migration-restore-order
spec:
  policyName: pod-migration-restore-order
  validationActions: ["Deny"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pod-migration-controller-pdb
  namespace: pod-migration-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pod-migration-controller
---
# API Priority and Fairness: without this, the controller's service account
# matches the default "service-accounts" FlowSchema (workload-low), which is the
# same priority level as most evicting clients. During a multi-pod drain the
# pending evictions hold workload-low seats while they wait on the eviction
# webhook, and the webhook's own API calls queue behind them until the webhook
# times out and fails open. A dedicated, non-lendable level keeps those calls
# moving. (GKE rejects user FlowSchemas that reference workload-high.)
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: PriorityLevelConfiguration
metadata:
  name: pod-migration-controller
spec:
  type: Limited
  limited:
    nominalConcurrencyShares: 15
    lendablePercent: 0
    limitResponse:
      type: Queue
      queuing:
        queues: 16
        handSize: 4
        queueLengthLimit: 50
---
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: pod-migration-controller
spec:
  matchingPrecedence: 5500
  priorityLevelConfiguration:
    name: pod-migration-controller
  distinguisherMethod:
    type: ByUser
  rules:
    - subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: pod-migration-controller
            namespace: pod-migration-system
      resourceRules:
        - verbs: ["*"]
          apiGroups: ["*"]
          resources: ["*"]
          namespaces: ["*"]
          clusterScope: true
      nonResourceRules:
        - verbs: ["*"]
          nonResourceURLs: ["*"]
