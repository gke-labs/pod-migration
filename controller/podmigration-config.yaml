apiVersion: podmigration.gke.io/v1alpha1
kind: PodMigration
metadata:
  name: diskless-migration
  namespace: default
spec:
  storage:
    # In multi-tenant environments, storage paths must be prefixed with the namespace (<namespace>/...).
    location: gs://<YOUR_BUCKET_NAME>/default/snapshots
    # tokenSource: federatedP4SA # Uncomment for multi-tenant path-restricted tokens (GKE Pod Snapshots)
