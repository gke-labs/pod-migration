name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: 'controller/go.mod'
        check-latest: false
        cache-dependency-path: |
          controller/go.sum
          tools/pmprofiler/go.sum

    - name: Verify Invariant Governance (T0)
      env:
        ALLOW_INVARIANT_COCHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-invariant-cochange') }}
      run: make -C controller verify-invariant-governance

    - name: Verify Generated Code Freshness
      run: make -C controller verify-generate

    - name: Run Unit Tests
      run: make -C controller test

    - name: Run pmprofiler & T2 Guardrail Self-Test
      run: make -C controller test-t2-guardrail

    - name: Run T3 SLO Guardrail & scalesim Capacity Model Self-Test
      run: make -C controller test-t3-guardrail

    - name: Run T5 Invariant Evolution Pipeline Self-Test
      run: make -C controller test-t5-guardrail
