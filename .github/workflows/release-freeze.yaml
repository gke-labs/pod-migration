name: Release freeze

# Until v0.1.0-alpha is tagged (#110), main takes only alpha work, bug fixes,
# tests, docs, CI and security fixes. This check fails a pull request that is
# labeled post-alpha, is in the Q1 2027 milestone, or references an issue in
# that milestone, so Q1 work waits for the tag. Once the tag is cut, set the
# repository variable ALPHA_FREEZE to "off" (or drop the required check) and
# re-run this check on the held pull requests.

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        edited,
        reopened,
        synchronize,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
      ]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  release-freeze:
    name: release-freeze
    runs-on: ubuntu-latest
    steps:
      - name: Hold Q1 work until v0.1.0-alpha is tagged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALPHA_FREEZE: ${{ vars.ALPHA_FREEZE }}
          FROZEN_MILESTONE: "Q1 2027: All Pod Migration Code Complete"
          HOLD_LABEL: post-alpha
        run: |
          set -euo pipefail
          if [ "${ALPHA_FREEZE:-on}" = "off" ]; then
            echo "The release freeze is off."
            exit 0
          fi

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels,milestone,body)"
          reasons=()
          if jq -e --arg label "$HOLD_LABEL" 'any(.labels[]?; .name == $label)' <<<"$pr_json" >/dev/null; then
            reasons+=("it is labeled $HOLD_LABEL")
          fi
          if jq -e --arg ms "$FROZEN_MILESTONE" '(.milestone.title // "") == $ms' <<<"$pr_json" >/dev/null; then
            reasons+=("it is in the milestone \"$FROZEN_MILESTONE\"")
          fi

          # Issues the description links with a closing keyword or "Part of".
          refs="$(jq -r '.body // ""' <<<"$pr_json" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|part of|addresses) +#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un || true)"
          for n in $refs; do
            ms="$(gh issue view "$n" --repo "$REPO" --json milestone --jq '.milestone.title // ""' 2>/dev/null || true)"
            if [ "$ms" = "$FROZEN_MILESTONE" ]; then
              reasons+=("it references #$n, which is in \"$FROZEN_MILESTONE\"")
            fi
          done

          if [ "${#reasons[@]}" -gt 0 ]; then
            for r in "${reasons[@]}"; do
              echo "::error title=Release freeze::This pull request waits for the v0.1.0-alpha tag (#110): $r."
            done
            exit 1
          fi
          echo "Not Q1 work, so the release freeze doesn't apply."
