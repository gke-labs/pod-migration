apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-migration-alerts
  namespace: pod-migration-system
  labels:
    app.kubernetes.io/name: pod-migration
    app.kubernetes.io/component: controller
    role: alert-rules
spec:
  groups:
    - name: pod-migration-controller.rules
      rules:
        - alert: PodMigrationPhaseDurationElevated
          expr: histogram_quantile(0.95, sum(rate(pod_migration_phase_duration_seconds_bucket[5m])) by (le, phase)) > 300
          for: 5m
          labels:
            severity: warning
            component: controller
          annotations:
            summary: "PodMigrationJob phase completion latency is elevated (P95 > 300s)"
            description: "Pod migration phase {{ $labels.phase }} P95 duration on completion is elevated at {{ $value | humanizeDuration }} (> 300s). Check for slow snapshot upload, extended container eviction, or placement delays. (Note: observed when jobs leave a phase; wedged migrations hitting ceilings alert on PodMigrationJobTimeoutsHigh)."
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/pmj-phase-stuck.md"

        - alert: PodMigrationJobTimeoutsHigh
          expr: sum(rate(pod_migration_outcomes_total{outcome=~"timeout|budget_timeout"}[15m])) > 0
          for: 10m
          labels:
            severity: warning
            component: controller
          annotations:
            summary: "Pod migration jobs are timing out"
            description: 'Pod migration jobs are encountering timeouts (rate: {{ $value | printf "%.4f" }}/s over 15m). Check PodDisruptionBudget availability or snapshot engine progress.'
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/pmj-phase-stuck.md"

        - alert: PodMigrationSchedulingGateWedged
          expr: sum by (namespace, pod) (kube_pod_status_reason{reason="SchedulingGated"}) > 0
          for: 10m
          labels:
            severity: warning
            component: admission-gate
          annotations:
            summary: "Pod scheduling gate is wedged"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in SchedulingGated status for more than 10 minutes (requires kube-state-metrics >= v2.19.0). If pod migration is enabled, this may indicate an orphaned or held scheduling gate ('gke.io/pod-migration-gate'). Note that this alert matches any gated pod (e.g. Kueue, Volcano); verify whether .spec.schedulingGates contains 'gke.io/pod-migration-gate' before remediating."
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/orphaned-scheduling-gate.md"

        - alert: PodMigrationHighColdFallbackRatio
          expr: (sum(rate(pod_migration_outcomes_total{outcome=~"fallback|succeeded_without_restore|restore_lost"}[15m])) / clamp_min(sum(rate(pod_migration_outcomes_total{outcome=~"succeeded|fallback|succeeded_without_restore|restore_lost"}[15m])), 0.001) > 0.15) and (sum(rate(pod_migration_outcomes_total{outcome=~"succeeded|fallback|succeeded_without_restore|restore_lost"}[15m])) > (2 / 900))
          for: 10m
          labels:
            severity: warning
            component: restore-engine
          annotations:
            summary: "High ratio of pod migrations completing as cold-start fallbacks"
            description: "Cold-start fallback ratio is {{ $value | humanizePercentage }} (> 15% of migrations over 15m across completed outcomes). Investigate node runtime compatibility, placement constraints, or snapshot corruption. (Note: captures explicit warm-restore fallbacks and lost restores; restore timeouts share outcome='timeout' and alert on PodMigrationJobTimeoutsHigh)."
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/high-cold-fallback-ratio.md"

        - alert: PodMigrationRestoreCrashFallbackDetected
          expr: rate(pod_migration_restore_crash_fallback_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
            component: restore-engine
          annotations:
            summary: "Replacement pod crashed on warm restore (cold fallback triggered)"
            description: 'A replacement pod crashed with a known gVisor/OCI restore error signature (rate: {{ $value | printf "%.4f" }}/s). The controller destroyed the crashing replacement and fell back to cold start.'
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/high-cold-fallback-ratio.md"

        - alert: PodMigrationRestoreCrashSignatureDrift
          expr: rate(pod_migration_restore_crash_unmatched_total[10m]) > 0
          for: 10m
          labels:
            severity: info
            component: restore-engine
          annotations:
            summary: "Unmatched restore-pod container crash observed (signature drift)"
            description: 'StartError/exit-128 container crash with no matched restore failure signature detected (rate: {{ $value | printf "%.4f" }}/s). Runtime error messages may need updating in controller signatures.'
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/high-cold-fallback-ratio.md"

        - alert: PodMigrationSnapshotStorageErrors
          expr: sum by (engine, verdict) (rate(pod_migration_restore_verdicts_total{verdict=~"snapshot_deleting|snapshot_gone|failed"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
            component: snapshot-storage
          annotations:
            summary: "Snapshot storage or retrieval failure detected"
            description: 'Snapshot restore verdict ''{{ $labels.verdict }}'' occurred for engine ''{{ $labels.engine }}'' (rate: {{ $value | printf "%.4f" }}/s). Snapshots may be prematurely deleted or bucket permissions failed (note: verdict=''failed'' indicates engine restore failure).'
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/snapshot-storage-errors.md"

        - alert: PodMigrationJobFailuresHigh
          expr: sum(rate(pod_migration_outcomes_total{outcome="failed"}[15m])) > (2 / 900)
          for: 10m
          labels:
            severity: warning
            component: controller
          annotations:
            summary: "Pod migration jobs failing repeatedly"
            description: 'Pod migration jobs are encountering terminal failures (rate: {{ $value | printf "%.4f" }}/s over 15m across PDB refusals, fence failures, storage, or runtime errors). Investigate controller logs, storage bucket connectivity, and engine health.'
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/snapshot-storage-errors.md"

        - alert: PodMigrationInvariantViolationDetected
          expr: sum by (invariant) (rate(pod_migration_invariant_violations_total[5m])) > 0
          for: 0m
          labels:
            severity: critical
            component: invariant-engine
          annotations:
            summary: "Pod migration correctness invariant violation detected"
            description: 'Correctness invariant ''{{ $labels.invariant }}'' was violated (rate: {{ $value | printf "%.4f" }}/s). Requires controller configured with --invariant-mode=observe or strict (default is disabled). Core safety guarantees breached; immediate operator intervention required.'
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/invariant-violations.md"

        - alert: PodMigrationBudgetExhaustedHigh
          expr: rate(pod_migration_budget_checks_total{result="budget_exhausted"}[15m]) > 0
          for: 10m
          labels:
            severity: warning
            component: eviction-gate
          annotations:
            summary: "PodDisruptionBudget checks blocking migrations"
            description: 'Pre-checkpoint disruption budget dry-run evictions are returning budget_exhausted (rate: {{ $value | printf "%.4f" }}/s). Workloads cannot be checkpointed without violating PDB constraints.'
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/pmj-phase-stuck.md"

        - alert: PodMigrationControllerDown
          expr: absent(up{job="pod-migration-controller"} == 1) or (up{job="pod-migration-controller"} == 0)
          for: 5m
          labels:
            severity: critical
            component: controller
          annotations:
            summary: "Pod migration controller is down"
            description: "No pod-migration-controller instances are reporting healthy status to Prometheus (assumes Prometheus scrape job 'pod-migration-controller' targeting port 8080; see monitoring/prometheus-service.yaml). Active migrations will stall and replacement pod scheduling gates will remain wedged."
            runbook_url: "https://github.com/gke-labs/pod-migration/blob/main/docs/runbooks/pmj-phase-stuck.md"
