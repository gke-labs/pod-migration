# kind cluster for the CRIU engine E2E (#230), created by up.sh. Two workers,
# so that a migration moves the pod to the other one. The kubelet's
# ContainerCheckpoint feature gate is on by default (beta since 1.30) and is
# left unset, so a node image where the gate is GA and removed still boots.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
- role: worker
