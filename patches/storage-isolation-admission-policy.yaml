apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-migration-storage-location
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["podmigration.gke.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podmigrations"]
  validations:
    - expression: >-
        !has(object.spec.storage.location) ||
        !object.spec.storage.location.startsWith('gs://') ||
        size(object.spec.storage.location.replace('gs://', '').split('/')) <= 1 ||
        object.spec.storage.location.replace('gs://', '').split('/')[1] == '' ||
        object.spec.storage.location.replace('gs://', '').split('/')[1] == object.metadata.namespace
      message: >-
        storage location path must be scoped to the namespace (gs://<bucket>/<namespace>/...) to prevent cross-namespace access in shared storage
      reason: Forbidden
    - expression: >-
        !has(object.spec.storage.location) ||
        !object.spec.storage.location.startsWith('gs://') ||
        !object.spec.storage.location.replace('gs://', '').split('/').exists(seg, seg == '.' || seg == '..')
      message: >-
        storage location path segments must not contain '.' or '..'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-migration-storage-location-binding
spec:
  policyName: pod-migration-storage-location
  validationActions: ["Deny"]
