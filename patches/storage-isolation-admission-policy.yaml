apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-migration-storage-location
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["podmigration.gke.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podmigrations"]
  validations:
    - expression: >-
        !has(object.spec.storage.location) ||
        (
          object.spec.storage.location.startsWith('gs://') &&
          !object.spec.storage.location.substring(5).contains('//') &&
          !object.spec.storage.location.substring(5).contains(' ') &&
          !object.spec.storage.location.substring(5).contains('\t') &&
          object.spec.storage.location.substring(5).split('/').size() >= 2 &&
          object.spec.storage.location.substring(5).split('/')[0] != '' &&
          object.spec.storage.location.substring(5).split('/')[1] == object.metadata.namespace &&
          !object.spec.storage.location.substring(5).split('/').exists(seg, seg == '.' || seg == '..')
        )
      message: >-
        storage location must be a valid GCS path scoped to the namespace (gs://<bucket>/<namespace>/...) without '.', '..', empty segments ('//'), or whitespace
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-migration-storage-location-binding
spec:
  policyName: pod-migration-storage-location
  validationActions: ["Deny"]
