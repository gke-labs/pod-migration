# podsnapshot.gke.io CRDs — the snapshot engine contract surface consumed by
# the gke-labs/pod-migration orchestrator.
#
# INSTALL RULE: apply these ONLY on clusters where the managed GKE Pod
# Snapshots addon is OFF. On addon-enabled clusters the schemas are owned by
# the managed addon; the CRIU engine must not install or overwrite them there.
#
# Specs are deliberately open (x-kubernetes-preserve-unknown-fields): the
# orchestrator writes these objects as unstructured resources, and the engine
# validates them semantically in its reconcilers.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podsnapshotstorageconfigs.podsnapshot.gke.io
  labels:
    pod-migrate.io/component: psengine
spec:
  group: podsnapshot.gke.io
  scope: Cluster
  names:
    kind: PodSnapshotStorageConfig
    listKind: PodSnapshotStorageConfigList
    plural: podsnapshotstorageconfigs
    singular: podsnapshotstorageconfig
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              # Written by the orchestrator's config reconciler:
              # spec.snapshotStorageConfig.gcs.{bucket,path}
              # (podmigration_controller.go:88-98)
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podsnapshotpolicies.podsnapshot.gke.io
  labels:
    pod-migrate.io/component: psengine
spec:
  group: podsnapshot.gke.io
  scope: Namespaced
  names:
    kind: PodSnapshotPolicy
    listKind: PodSnapshotPolicyList
    plural: podsnapshotpolicies
    singular: podsnapshotpolicy
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              # Written by the orchestrator (podmigration_controller.go:118-133):
              # storageConfigName, selector, triggerConfig{type, postCheckpoint}.
              # Read by its eviction webhook, which requires
              # status.conditions[Ready]=True (eviction_webhook.go:284-301) —
              # the engine's PSP reconciler owns that condition.
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podsnapshotmanualtriggers.podsnapshot.gke.io
  labels:
    pod-migrate.io/component: psengine
spec:
  group: podsnapshot.gke.io
  scope: Namespaced
  names:
    kind: PodSnapshotManualTrigger
    listKind: PodSnapshotManualTriggerList
    plural: podsnapshotmanualtriggers
    singular: podsnapshotmanualtrigger
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: TargetPod
          type: string
          jsonPath: .spec.targetPod
        - name: Snapshot
          type: string
          jsonPath: .status.snapshotCreated.name
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              # Written by the orchestrator's PMJ controller with
              # spec.targetPod (podmigrationjob_controller.go:516-518); it
              # polls status.snapshotCreated.name (:247) — the engine's PSMT
              # watcher answers it.
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podsnapshots.podsnapshot.gke.io
  labels:
    pod-migrate.io/component: psengine
spec:
  group: podsnapshot.gke.io
  scope: Namespaced
  names:
    kind: PodSnapshot
    listKind: PodSnapshotList
    plural: podsnapshots
    singular: podsnapshot
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Checkpoint
          type: string
          jsonPath: .status.conditions[?(@.type=="Checkpoint")].reason
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              # Polled by the PMJ controller: ready iff conditions contain
              # {Ready,True} or {Checkpoint,True,Succeeded}
              # (podmigrationjob_controller.go:310-324). The engine sets Ready
              # only after the GCS upload is verified.
              type: object
              x-kubernetes-preserve-unknown-fields: true
