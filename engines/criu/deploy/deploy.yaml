# WARNING: EXPERIMENTAL — FOR NON-PRODUCTION TEST CLUSTERS ONLY (#129, #244).
# See https://github.com/gke-labs/pod-migration/issues/129 and #244 for the
# security hardening tracker: checkpoint archives in GCS do not yet carry
# cryptographic provenance (R2) and the hostNetwork agent uses the node's
# GCE service account (R5), so anyone who can write to the checkpoint GCS bucket
# can get root on a restoring node until R2 and R5 land. The agent holds
# cluster-wide pods (update/patch) and nodes (patch/checkpoint) RBAC, and a
# residual dual-start window exists if holder fallback precedes restore. Never
# deploy to production clusters.
