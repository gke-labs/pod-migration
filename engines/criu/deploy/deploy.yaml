# WARNING: EXPERIMENTAL — FOR NON-PRODUCTION TEST CLUSTERS ONLY: the security
# requirements R1, R3, R4 and R6 are still open (C10 in
# docs/design/engine-contract.md). Checkpoint archives carry provenance (R2,
# #244): the node agent signs each manifest with a key from the
# pod-migrate-archive-signing-keys Secret (create it before the agent starts,
# see engines/criu/README.md) and refuses unsigned or misbound archives. The
# engine uses the bucket as its own service accounts (R5, #244): the
# hostNetwork agent exchanges its projected service account token at Google
# STS instead of using the node's VM service account. Give it a bucket that
# only the CRIU engine uses and that grants object access to those two
# service accounts alone (patches/setup-criu-storage.sh). Anyone who can get
# a token for them, has storage access through the project, or compromises a
# node can still read, delete or corrupt archives (restores then fall back to
# a cold start), and anyone who can read Secrets in pod-migration-criu-system
# or compromise a node agent can sign an archive. The agent holds
# cluster-wide pods (update/patch) and nodes (patch/checkpoint) RBAC, and a
# residual dual-start window exists if holder fallback precedes restore.
# Never deploy to production clusters.
