# Deployment manifest for the CRIU snapshot engine (engines/criu).
#
# Replace <YOUR_CRIU_ENGINE_IMAGE>, <YOUR_CRIU_AGENT_IMAGE>,
# <YOUR_CRIU_HOLDER_IMAGE>, <YOUR_WORKLOAD_POOL> and <YOUR_IDENTITY_PROVIDER>
# before applying (see engines/criu/README.md). Requires cert-manager in the
# cluster for the restore-injection webhook certificate, and Workload
# Identity on the cluster for bucket access.
apiVersion: v1
kind: Namespace
metadata:
  name: pod-migration-criu-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-migrate-psengine-controller
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-migrate-agent
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-migrate-psengine-controller
  labels:
    pod-migrate.io/component: psengine
rules:
  - apiGroups: ["criu.podmigration.gke.io"]
    resources:
      [
        "podsnapshotstorageconfigs",
        "podsnapshotpolicies",
        "podsnapshotmanualtriggers",
        "podsnapshots",
      ]
    verbs: ["get", "list", "watch", "create"]
  # The archive finalizer: added at create, removed once the archive is
  # deleted from the bucket (#107). Delete: a work order an earlier trigger
  # left with an outcome is deleted before the trigger, created again for the
  # same pod, gets its own (#262).
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshots"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: ["criu.podmigration.gke.io"]
    resources:
      [
        "podsnapshotpolicies/status",
        "podsnapshotmanualtriggers/status",
        "podsnapshots/status",
      ]
    verbs: ["get", "update", "patch"]
  # list: before deleting a work order an earlier trigger left, the engine
  # checks live that no job still names it (#262).
  - apiGroups: ["podmigration.gke.io"]
    resources: ["podmigrationjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-migrate-psengine-controller
  labels:
    pod-migrate.io/component: psengine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-migrate-psengine-controller
subjects:
  - kind: ServiceAccount
    name: pod-migrate-psengine-controller
    namespace: pod-migration-criu-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-migrate-psengine-agent
  labels:
    pod-migrate.io/component: psengine
rules:
  - apiGroups: [""]
    resources: ["nodes/checkpoint"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshots/status"]
    verbs: ["get", "update", "patch"]
  # A live get of the work order's trigger before the checkpoint and before
  # committing: a deleted trigger cancels the work order (C9, #106).
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshotmanualtriggers"]
    verbs: ["get"]
  - apiGroups: ["podmigration.gke.io"]
    resources: ["podmigrationjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The cluster UID that each archive manifest binds the archive to: the
  # kube-system Namespace's UID, read once at startup (#244).
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-migrate-psengine-agent
  labels:
    pod-migrate.io/component: psengine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-migrate-psengine-agent
subjects:
  - kind: ServiceAccount
    name: pod-migrate-agent
    namespace: pod-migration-criu-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-migrate-psengine-leader-election
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-migrate-psengine-leader-election
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-migrate-psengine-leader-election
subjects:
  - kind: ServiceAccount
    name: pod-migrate-psengine-controller
    namespace: pod-migration-criu-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-migrate-psengine
  namespace: pod-migration-criu-system
  labels:
    app: pod-migrate-psengine
    pod-migrate.io/component: psengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-migrate-psengine
  template:
    metadata:
      labels:
        app: pod-migrate-psengine
        pod-migrate.io/component: psengine
    spec:
      serviceAccountName: pod-migrate-psengine-controller
      containers:
        - name: engine
          image: <YOUR_CRIU_ENGINE_IMAGE>
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --enable-webhooks=true
            - --holder-image=<YOUR_CRIU_HOLDER_IMAGE>
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-cert
          secret:
            secretName: pod-migrate-psengine-webhook-cert
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-migrate-agent
  namespace: pod-migration-criu-system
  labels:
    app: pod-migrate-agent
    pod-migrate.io/component: psengine
spec:
  selector:
    matchLabels:
      app: pod-migrate-agent
  template:
    metadata:
      labels:
        app: pod-migrate-agent
        pod-migrate.io/component: psengine
    spec:
      serviceAccountName: pod-migrate-agent
      hostNetwork: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
                  - key: sandbox.gke.io/runtime
                    operator: NotIn
                    values: ["gvisor"]
                  # COS mounts /usr/local read-only until #109 moves the CRIU
                  # install path onto /home/kubernetes/bin.
                  - key: cloud.google.com/gke-os-distribution
                    operator: NotIn
                    values: ["cos"]
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: <YOUR_CRIU_AGENT_IMAGE>
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Bucket credentials (#244): the agent exchanges its projected
            # service account token (the gcs-token volume) at Google STS for
            # an access token of its own Kubernetes service account. Replace
            # both placeholders before applying (see engines/criu/README.md,
            # Storage credentials); the agent doesn't start with either left.
            - name: WORKLOAD_POOL
              value: <YOUR_WORKLOAD_POOL>
            - name: IDENTITY_PROVIDER
              value: <YOUR_IDENTITY_PROVIDER>
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: pod-migrate
              mountPath: /var/lib/pod-migrate
              mountPropagation: Bidirectional
            - name: containerd-run
              mountPath: /run/containerd
              mountPropagation: HostToContainer
            - name: containerd-state
              mountPath: /var/lib/containerd
            - name: kubelet-checkpoints
              mountPath: /var/lib/kubelet/checkpoints
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
            - name: etc-criu
              mountPath: /etc/criu
            - name: host-sbin
              mountPath: /usr/local/sbin
            # The archive signing keys (--archive-signing-keys-dir, #244).
            - name: archive-signing-keys
              mountPath: /etc/pod-migrate/archive-signing
              readOnly: true
            # The service account token the agent exchanges for bucket
            # access (--gcs-token-file, #244).
            - name: gcs-token
              mountPath: /var/run/secrets/pod-migrate/gcs-token
              readOnly: true
      volumes:
        # Create this Secret before the agent starts, and on an existing
        # install before you apply this file (see engines/criu/README.md);
        # the agent's pods wait for it. Only the agent mounts it: workloads
        # must never read it.
        - name: archive-signing-keys
          secret:
            secretName: pod-migrate-archive-signing-keys
            optional: false
            defaultMode: 0400
        # A token of the pod-migrate-agent service account for the
        # cluster's Workload Identity pool, which the kubelet rotates.
        - name: gcs-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: <YOUR_WORKLOAD_POOL>
                  expirationSeconds: 3600
                  path: token
        - name: pod-migrate
          hostPath:
            path: /var/lib/pod-migrate
            type: DirectoryOrCreate
        - name: containerd-run
          hostPath:
            path: /run/containerd
            type: Directory
        - name: containerd-state
          hostPath:
            path: /var/lib/containerd
            type: Directory
        - name: kubelet-checkpoints
          hostPath:
            path: /var/lib/kubelet/checkpoints
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: etc-criu
          hostPath:
            path: /etc/criu
            type: DirectoryOrCreate
        - name: host-sbin
          hostPath:
            path: /usr/local/sbin
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pod-migrate-psengine-webhook
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
spec:
  selector:
    app: pod-migrate-psengine
  ports:
    - port: 443
      targetPort: 9443
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: pod-migrate-psengine-selfsigned
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pod-migrate-psengine-webhook
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
spec:
  secretName: pod-migrate-psengine-webhook-cert
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - pod-migrate-psengine-webhook.pod-migration-criu-system.svc
    - pod-migrate-psengine-webhook.pod-migration-criu-system.svc.cluster.local
  issuerRef:
    name: pod-migrate-psengine-selfsigned
    kind: Issuer
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: pod-migrate-psengine-restore-inject
  labels:
    pod-migrate.io/component: psengine
  annotations:
    cert-manager.io/inject-ca-from: pod-migration-criu-system/pod-migrate-psengine-webhook
webhooks:
  - name: restore-inject.psengine.pod-migrate.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchLabels:
        pod-migration.gke.io/managed: "true"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - pod-migration-system
            - pod-migration-criu-system
    clientConfig:
      service:
        name: pod-migrate-psengine-webhook
        namespace: pod-migration-criu-system
        path: /psengine-restore-inject
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
---
# The restore outcome on a pod (#233). The node agent records it once in
# pod-migrate.io/psengine-restore: "restored" or "failed", and, with failed,
# why in pod-migrate.io/psengine-restore-reason (#244). The holder reads the
# outcome to continue as the restored process or to start cold, and the engine
# and the orchestrator read both to judge the restore and say why it failed.
# So on an existing pod, only the agent may write them, only once (the reason
# in the same update as the outcome, and only with failed), and nobody may
# change or remove them afterwards.
#
# It is an admission policy, not a webhook: the API server evaluates it
# itself, so it doesn't depend on the engine being up. matchConditions skip
# every update that leaves both annotations as they are, the kubelet's status
# writes included.
#
# The validation below names the node agent's service account, namespace
# included. An install that renames the namespace or the service account must
# change it there too, or the agent itself is denied.
#
# To edit the annotations by hand in an emergency, set the binding's
# validationActions to ["Audit"], and back to ["Deny"] afterwards (see the
# README). While it is Audit, no pod in the cluster is protected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-migrate-psengine-restore-status
  labels:
    pod-migrate.io/component: psengine
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        # A write to pods/status can change annotations too.
        resources: ["pods", "pods/status"]
        scope: Namespaced
    namespaceSelector:
      matchLabels:
        pod-migration.gke.io/managed: "true"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - pod-migration-system
            - pod-migration-criu-system
  matchConditions:
    # True when the outcome or its reason is added, changed or removed.
    - name: restore-outcome-changed
      expression: >-
        ['pod-migrate.io/psengine-restore', 'pod-migrate.io/psengine-restore-reason'].exists(k,
        (has(object.metadata.annotations) &&
        k in object.metadata.annotations)
        !=
        (has(oldObject.metadata.annotations) &&
        k in oldObject.metadata.annotations)
        ||
        (has(object.metadata.annotations) &&
        k in object.metadata.annotations &&
        has(oldObject.metadata.annotations) &&
        k in oldObject.metadata.annotations &&
        object.metadata.annotations[k] != oldObject.metadata.annotations[k]))
  validations:
    # The node agent's service account: the namespace and name of the
    # pod-migrate-agent ServiceAccount in this file.
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:pod-migration-criu-system:pod-migrate-agent'
      message: >-
        only the CRIU node agent may record a restore outcome
        (pod-migrate.io/psengine-restore) or its reason
        (pod-migrate.io/psengine-restore-reason) on a pod
      reason: Forbidden
    # Written once: from unset (or empty) to restored or failed. An update
    # that changes the reason must be that one too, so the reason can't be
    # changed or removed afterwards either.
    - expression: >-
        !(has(oldObject.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['pod-migrate.io/psengine-restore'] != '')
        &&
        has(object.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in object.metadata.annotations &&
        object.metadata.annotations['pod-migrate.io/psengine-restore'] in ['restored', 'failed']
      message: >-
        pod-migrate.io/psengine-restore is written once, as "restored" or
        "failed", with its reason (pod-migrate.io/psengine-restore-reason) in
        the same update, and neither can be changed or removed afterwards
      reason: Forbidden
    # A reason says why a restore failed: it goes only with failed.
    - expression: >-
        !(has(object.metadata.annotations) &&
        'pod-migrate.io/psengine-restore-reason' in object.metadata.annotations)
        ||
        ('pod-migrate.io/psengine-restore' in object.metadata.annotations &&
        object.metadata.annotations['pod-migrate.io/psengine-restore'] == 'failed')
      message: >-
        pod-migrate.io/psengine-restore-reason is recorded only with
        pod-migrate.io/psengine-restore: failed
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-migrate-psengine-restore-status
  labels:
    pod-migrate.io/component: psengine
spec:
  policyName: pod-migrate-psengine-restore-status
  validationActions: ["Deny"]
