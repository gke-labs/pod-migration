# Deployment manifest for the CRIU snapshot engine (engines/criu).
#
# Replace <YOUR_CRIU_ENGINE_IMAGE>, <YOUR_CRIU_AGENT_IMAGE>, and
# <YOUR_CRIU_HOLDER_IMAGE> before applying. Requires cert-manager in the
# cluster for the restore-injection webhook certificate.
apiVersion: v1
kind: Namespace
metadata:
  name: pod-migration-criu-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-migrate-psengine-controller
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-migrate-agent
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-migrate-psengine-controller
  labels:
    pod-migrate.io/component: psengine
rules:
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshotstorageconfigs", "podsnapshotpolicies", "podsnapshotmanualtriggers", "podsnapshots"]
    verbs: ["get", "list", "watch", "create"]
  # The archive finalizer: added at create, removed once the archive is
  # deleted from the bucket (#107). Delete: a work order an earlier trigger
  # left with an outcome is deleted before the trigger, created again for the
  # same pod, gets its own (#262).
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshots"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshotpolicies/status", "podsnapshotmanualtriggers/status", "podsnapshots/status"]
    verbs: ["get", "update", "patch"]
  # list: before deleting a work order an earlier trigger left, the engine
  # checks live that no job still names it (#262).
  - apiGroups: ["podmigration.gke.io"]
    resources: ["podmigrationjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-migrate-psengine-controller
  labels:
    pod-migrate.io/component: psengine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-migrate-psengine-controller
subjects:
  - kind: ServiceAccount
    name: pod-migrate-psengine-controller
    namespace: pod-migration-criu-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-migrate-psengine-agent
  labels:
    pod-migrate.io/component: psengine
rules:
  - apiGroups: [""]
    resources: ["nodes/checkpoint"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshots/status"]
    verbs: ["get", "update", "patch"]
  # A live get of the work order's trigger before the checkpoint and before
  # committing: a deleted trigger cancels the work order (C9, #106).
  - apiGroups: ["criu.podmigration.gke.io"]
    resources: ["podsnapshotmanualtriggers"]
    verbs: ["get"]
  - apiGroups: ["podmigration.gke.io"]
    resources: ["podmigrationjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-migrate-psengine-agent
  labels:
    pod-migrate.io/component: psengine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-migrate-psengine-agent
subjects:
  - kind: ServiceAccount
    name: pod-migrate-agent
    namespace: pod-migration-criu-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-migrate-psengine-leader-election
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-migrate-psengine-leader-election
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-migrate-psengine-leader-election
subjects:
  - kind: ServiceAccount
    name: pod-migrate-psengine-controller
    namespace: pod-migration-criu-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-migrate-psengine
  namespace: pod-migration-criu-system
  labels:
    app: pod-migrate-psengine
    pod-migrate.io/component: psengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-migrate-psengine
  template:
    metadata:
      labels:
        app: pod-migrate-psengine
        pod-migrate.io/component: psengine
    spec:
      serviceAccountName: pod-migrate-psengine-controller
      containers:
        - name: engine
          image: <YOUR_CRIU_ENGINE_IMAGE>
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --enable-webhooks=true
            - --holder-image=<YOUR_CRIU_HOLDER_IMAGE>
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-cert
          secret:
            secretName: pod-migrate-psengine-webhook-cert
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-migrate-agent
  namespace: pod-migration-criu-system
  labels:
    app: pod-migrate-agent
    pod-migrate.io/component: psengine
spec:
  selector:
    matchLabels:
      app: pod-migrate-agent
  template:
    metadata:
      labels:
        app: pod-migrate-agent
        pod-migrate.io/component: psengine
    spec:
      serviceAccountName: pod-migrate-agent
      hostNetwork: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
                  - key: sandbox.gke.io/runtime
                    operator: NotIn
                    values: ["gvisor"]
                  # COS mounts /usr/local read-only until #109 moves the CRIU
                  # install path onto /home/kubernetes/bin.
                  - key: cloud.google.com/gke-os-distribution
                    operator: NotIn
                    values: ["cos"]
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: <YOUR_CRIU_AGENT_IMAGE>
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: pod-migrate
              mountPath: /var/lib/pod-migrate
              mountPropagation: Bidirectional
            - name: containerd-run
              mountPath: /run/containerd
              mountPropagation: HostToContainer
            - name: containerd-state
              mountPath: /var/lib/containerd
            - name: kubelet-checkpoints
              mountPath: /var/lib/kubelet/checkpoints
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
            - name: etc-criu
              mountPath: /etc/criu
            - name: host-sbin
              mountPath: /usr/local/sbin
      volumes:
        - name: pod-migrate
          hostPath:
            path: /var/lib/pod-migrate
            type: DirectoryOrCreate
        - name: containerd-run
          hostPath:
            path: /run/containerd
            type: Directory
        - name: containerd-state
          hostPath:
            path: /var/lib/containerd
            type: Directory
        - name: kubelet-checkpoints
          hostPath:
            path: /var/lib/kubelet/checkpoints
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: etc-criu
          hostPath:
            path: /etc/criu
            type: DirectoryOrCreate
        - name: host-sbin
          hostPath:
            path: /usr/local/sbin
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pod-migrate-psengine-webhook
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
spec:
  selector:
    app: pod-migrate-psengine
  ports:
    - port: 443
      targetPort: 9443
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: pod-migrate-psengine-selfsigned
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pod-migrate-psengine-webhook
  namespace: pod-migration-criu-system
  labels:
    pod-migrate.io/component: psengine
spec:
  secretName: pod-migrate-psengine-webhook-cert
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - pod-migrate-psengine-webhook.pod-migration-criu-system.svc
    - pod-migrate-psengine-webhook.pod-migration-criu-system.svc.cluster.local
  issuerRef:
    name: pod-migrate-psengine-selfsigned
    kind: Issuer
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: pod-migrate-psengine-restore-inject
  labels:
    pod-migrate.io/component: psengine
  annotations:
    cert-manager.io/inject-ca-from: pod-migration-criu-system/pod-migrate-psengine-webhook
webhooks:
  - name: restore-inject.psengine.pod-migrate.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: IfNeeded
    objectSelector:
      matchLabels:
        pod-migration.gke.io/enabled: "true"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - pod-migration-system
            - pod-migration-criu-system
    clientConfig:
      service:
        name: pod-migrate-psengine-webhook
        namespace: pod-migration-criu-system
        path: /psengine-restore-inject
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
---
# The restore outcome on a pod (#233). The node agent records it once in
# pod-migrate.io/psengine-restore: "restored" or "failed". The holder reads it to
# continue as the restored process or to start cold, and the engine and the
# orchestrator read it to judge the restore. So on an existing pod, only the
# agent may write it, only once, and nobody may change or remove it afterwards.
#
# It is an admission policy, not a webhook: the API server evaluates it
# itself, so it doesn't depend on the engine being up. matchConditions skip
# every update that leaves the annotation as it is, the kubelet's status
# writes included.
#
# To edit the annotation by hand in an emergency, delete the binding below,
# and apply it again afterwards.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-migrate-psengine-restore-status
  labels:
    pod-migrate.io/component: psengine
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        # A write to pods/status can change annotations too.
        resources: ["pods", "pods/status"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - pod-migration-system
            - pod-migration-criu-system
  matchConditions:
    # True when the annotation is added, changed or removed.
    - name: restore-status-changed
      expression: >-
        (has(object.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in object.metadata.annotations)
        !=
        (has(oldObject.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in oldObject.metadata.annotations)
        ||
        (has(object.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in object.metadata.annotations &&
        has(oldObject.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in oldObject.metadata.annotations &&
        object.metadata.annotations['pod-migrate.io/psengine-restore'] !=
        oldObject.metadata.annotations['pod-migrate.io/psengine-restore'])
  validations:
    # The node agent's service account: the namespace and name of the
    # pod-migrate-agent ServiceAccount in this file.
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:pod-migration-criu-system:pod-migrate-agent'
      message: >-
        only the CRIU node agent may record a restore outcome
        (pod-migrate.io/psengine-restore) on a pod
      reason: Forbidden
    # Written once: from unset (or empty) to restored or failed.
    - expression: >-
        !(has(oldObject.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['pod-migrate.io/psengine-restore'] != '')
        &&
        has(object.metadata.annotations) &&
        'pod-migrate.io/psengine-restore' in object.metadata.annotations &&
        object.metadata.annotations['pod-migrate.io/psengine-restore'] in ['restored', 'failed']
      message: >-
        pod-migrate.io/psengine-restore is written once, as "restored" or
        "failed", and can't be changed or removed afterwards
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-migrate-psengine-restore-status
  labels:
    pod-migrate.io/component: psengine
spec:
  policyName: pod-migrate-psengine-restore-status
  validationActions: ["Deny"]
